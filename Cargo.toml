[package]
name = "stryke-app"
version = "0.1.0"
edition = "2021"
description = "App automation cdylib for the stryke `App` package — drive MenkeTechnologies GUI apps over the GUI Automation Bus"
authors = ["MenkeTechnologies"]
license = "MIT"
repository = "https://github.com/MenkeTechnologies/stryke-app"
homepage = "https://menketechnologies.github.io/stryke-app/"
publish = false

# Shipped as a precompiled cdylib loaded in-process by stryke via dlopen.
# Each `#[no_mangle] extern "C" fn app__*(args_json: *const c_char) -> *const c_char`
# is registered as a stryke-callable function on first `use App`. The client
# holds a per-app Unix-socket connection in a process-wide pool, reconnecting
# on a broken pipe — no fork, no reconnect per call. Also built as an rlib so
# the integration test can drive the client against a real `zgui-bridge` host.
[lib]
name = "stryke_app"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
once_cell = "1"

# The bus client uses native local IPC per platform: std Unix domain sockets on
# macOS/Linux (no dep), and the named pipe `\\.\pipe\<app>.sock` via `interprocess`
# on Windows.
[target.'cfg(windows)'.dependencies]
interprocess = "2"

[dev-dependencies]
# The host side of the bus — used only to stand up a real socket in the
# end-to-end test. Not a runtime dependency (stryke-app is self-contained).
zgui-bridge = { path = "../zgui-bridge" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
